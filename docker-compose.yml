version: "3.9"

services:
  scout:
    build: .
    env_file: .env
    environment:
      - APPROVED_DIRECTORY=/app
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    ports:
      - "8080:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
